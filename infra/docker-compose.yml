version: "3.9"

services:
  nextjs:
    build:
      context: ../frontend/certstack
      dockerfile: ../../infra/Dockerfile.react
    ports:
      - "3000:3000"
    volumes:
      - ../frontend/certstack:/app
      - /app/node_modules
    command: npm run dev

  fastapi:
    build:
      context: ../backend/src
      dockerfile: ../../infra/Dockerfile.backend
    ports: 
      - "8000:8000"
    env_file:
      - ../backend/src/.env
    volumes:
      - type: bind
        source: ../backend/src
        target: /app
    depends_on:
      - redis

  redis:
    image: redis:7
    ports:
      - "6379:6379"
      