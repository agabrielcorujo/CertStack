services:
  backend:
    image: python:3.11-slim
    working_dir: /workspace
    volumes:
      - ..:/workspace
    ports:
      - "8000:8000"
    command: sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn backend.src.app:app --host 0.0.0.0 --port 8000"

  react:
    build:
      context: ../frontend/certstack
      dockerfile: ../../infra/Dockerfile.react
    ports:
      - "3003:3000"
    volumes:
      - ../frontend/certstack:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    command: sh -c "npm install --legacy-peer-deps && npm run build && npm run start -- --hostname 0.0.0.0 --port 3000"