name: Promote testing to prod

on:
  push:
    branches:
      - testing

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # placeholder "tests"
      - name: Run tests (placeholder)
        run: |
          echo "running tests..."
          sleep 2
          echo "tests passed"

      - name: Merge testing into prod
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: prod
          head: testing
          title: "Promote testing to prod"
          body: |
            Auto-generated PR:
            testing passed all checks → promoting to prod.
          branch: auto/testing-to-prod
          delete-branch: true
