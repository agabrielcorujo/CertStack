name: test-and-promote

on:
  push:
    branches:
      - testing

jobs:
  test-and-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tests
        run: |
          echo "Running tests..."
          echo "All tests passed ✅"

      - name: Create PR to prod
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: prod
          branch: auto/testing-to-prod
          title: "Merge testing into prod"
          body: |
            ✅ Tests passed automatically.
      
            This PR was created by GitHub Actions after a successful push to `testing`.
