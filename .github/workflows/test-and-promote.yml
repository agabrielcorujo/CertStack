permissions:
  contents: read
  pull-requests: write

name: test-and-promote

on:
  push:
    branches:
      - testing

jobs:
  test-and-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tests
        run: |
          echo "Running tests..."
          echo "All tests passed ✅"

      - name: Create PR from testing to prod
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh pr create \
            --base prod \
            --head testing \
            --title "Merge testing into prod" \
            --body "✅ Tests passed automatically."
